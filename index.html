<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="一次森林冒险，找到你的内在驱动兽。基于《Drive》内在驱动力理论的移动端互动测试。">
  <meta property="og:title" content="寻找你的内在驱动兽">
  <meta property="og:description" content="我的动力兽是？来驱动森林走一趟就知道了。">
  <title>寻找你的内在驱动兽 | Find Your Inner Drive Animal</title>
  <style>
    :root {
      --bg-deep: #06120C;
      --bg-mid: #0B2016;
      --fire: #F5C451;
      --fire-soft: #FFB45E;
      --star: #8FC7E0;
      --text: #EAF4EC;
      --text-2: rgba(234, 244, 236, 0.72);
      --text-mute: rgba(234, 244, 236, 0.45);
      --card: rgba(255, 255, 255, 0.05);
      --border: rgba(180, 220, 190, 0.14);
      --fox: #F2A65A;
      --wolf: #7EC8E3;
      --dolphin: #F58CA8;
      --bear: #F5C451;
      --whale: #8FA9E8;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; }
    body {
      font-family: "PingFang SC", "Noto Sans SC", "Helvetica Neue", Arial, sans-serif;
      background: var(--bg-deep);
      color: var(--text);
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }
    #app {
      width: 100%; height: 100%;
      max-width: 480px; margin: 0 auto;
      position: relative; overflow: hidden;
      background: linear-gradient(180deg, #06120C 0%, #0A1C13 52%, #07140D 100%);
    }
    .bg-glow {
      position: fixed; inset: 0; pointer-events: none; z-index: 0;
      background:
        radial-gradient(circle at 78% 12%, rgba(245, 196, 81, 0.16) 0%, transparent 36%),
        radial-gradient(circle at 18% 30%, rgba(143, 199, 224, 0.12) 0%, transparent 34%),
        radial-gradient(circle at 50% 88%, rgba(245, 196, 81, 0.10) 0%, transparent 42%);
    }
    .stars, .fireflies { position: fixed; inset: 0; pointer-events: none; z-index: 0; }
    .star { position: absolute; border-radius: 50%; background: #CFE8E0; animation: twinkle 3.4s ease-in-out infinite; }
    @keyframes twinkle { 0%,100% { opacity: 0.2; } 50% { opacity: 0.9; } }
    .firefly { position: absolute; border-radius: 50%; background: var(--fire); filter: blur(1px); animation: float 7s ease-in-out infinite; }
    @keyframes float { 0%,100% { transform: translateY(0) translateX(0); opacity: 0.25; } 50% { transform: translateY(-26px) translateX(14px); opacity: 0.85; } }

    .screen {
      position: absolute; inset: 0; z-index: 2;
      overflow-y: auto; overflow-x: hidden;
      opacity: 0; pointer-events: none;
      transform: translateY(18px);
      transition: opacity 0.5s ease, transform 0.5s ease;
      padding: var(--safe-top) 0 var(--safe-bottom);
    }
    .screen.active { opacity: 1; pointer-events: auto; transform: translateY(0); }
    .screen::-webkit-scrollbar { width: 0; }

    /* ---------- Intro illustration (动态插画) ---------- */
    .forest-illust { position: absolute; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
    .forest-illust .fl { position: absolute; left: 0; bottom: 0; width: 100%; }
    .fl-mountains { height: 72%; opacity: .9; }
    .fl-trees { height: 60%; }
    .fl-grass { height: 30%; }
    .fl-fog { position: absolute; left: -50%; bottom: 33%; width: 200%; height: 54px; background: linear-gradient(90deg, transparent, rgba(207,232,224,.10) 25%, rgba(207,232,224,.16) 50%, rgba(207,232,224,.10) 75%, transparent); filter: blur(6px); animation: fogDrift 18s linear infinite, fogBreath 7s ease-in-out infinite; }
    @keyframes fogDrift { from { transform: translateX(0); } to { transform: translateX(25%); } }
    @keyframes fogBreath { 0%,100% { opacity: .5; } 50% { opacity: .95; } }
    .screen.active .fl { animation: riseIn 1.4s cubic-bezier(.2,.8,.2,1) both; }
    .screen.active .fl-mountains { animation-delay: .08s; }
    .screen.active .fl-trees { animation-delay: .22s; }
    .screen.active .fl-grass { animation-delay: .36s; }
    @keyframes riseIn { from { opacity: 0; transform: translateY(40px) scale(1.04); } to { opacity: 1; transform: none; } }
    .home-inner .seed-wrap, .home-inner .home-eyebrow, .home-inner .home-title, .home-inner .home-desc, .home-inner .btn-primary, .home-inner .home-foot { position: relative; z-index: 2; }

    .warp-veil { position: absolute; inset: 0; z-index: 300; pointer-events: none; opacity: 0; clip-path: circle(0% at 50% 44%); background: radial-gradient(circle at 50% 44%, #FFE7A8 0%, #F5C451 22%, #0A1C13 60%, #06120C 100%); transition: clip-path .72s cubic-bezier(.7,0,.25,1), opacity .25s ease; }
    .warp-veil.play { opacity: 1; clip-path: circle(150% at 50% 44%); }

    .story-art { width: 132px; height: 132px; margin: 0 auto 18px; display: flex; align-items: flex-end; justify-content: center; }
    .story-art.show { animation: artIn .55s ease both; }
    @keyframes artIn { from { opacity: 0; transform: translateY(12px) scale(.94); } to { opacity: 1; transform: none; } }
    .story-art .art-svg { width: 100%; height: 100%; overflow: visible; }
    .glow-pulse { transform-origin: 60px 76px; animation: glowPulse 2.4s ease-in-out infinite; }
    @keyframes glowPulse { 0%,100% { transform: scale(1); opacity: .85; } 50% { transform: scale(1.18); opacity: 1; } }
    .drift { animation: driftUp 3.2s ease-in-out infinite; }
    .d1 { animation-delay: 0s; } .d2 { animation-delay: .6s; } .d3 { animation-delay: 1.1s; } .d4 { animation-delay: 1.6s; } .d5 { animation-delay: 2.1s; }
    @keyframes driftUp { 0% { transform: translateY(6px); opacity: 0; } 30% { opacity: .9; } 100% { transform: translateY(-22px); opacity: 0; } }
    .appear { transform-origin: 60px 100px; animation: appear 1.6s ease both; }
    @keyframes appear { from { opacity: 0; transform: translateY(14px) scale(.96); } to { opacity: 1; transform: none; } }
    .footprints { animation: fpBreath 3s ease-in-out infinite; transform-origin: center; }
    @keyframes fpBreath { 0%,100% { opacity: .82; } 50% { opacity: 1; } }

    /* ---------- Home ---------- */
    .home-inner {
      position: relative; z-index: 2;
      min-height: 100%;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 40px 28px;
      text-align: center;
    }
    .seed-wrap { position: relative; width: 150px; height: 150px; margin-bottom: 34px; display: flex; align-items: center; justify-content: center; }
    .seed {
      width: 64px; height: 64px; border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #FFF3C9, var(--fire) 55%, #C9852B);
      box-shadow: 0 0 50px 18px rgba(245, 196, 81, 0.45), 0 0 120px 40px rgba(245, 196, 81, 0.18);
      animation: breathe 3.6s ease-in-out infinite;
    }
    .seed::after {
      content: ""; position: absolute; inset: -22px; border-radius: 50%;
      border: 1px solid rgba(245, 196, 81, 0.3);
      animation: ring 3.6s ease-out infinite;
    }
    @keyframes breathe { 0%,100% { transform: scale(1); } 50% { transform: scale(1.12); } }
    @keyframes ring { 0% { transform: scale(0.7); opacity: 0.7; } 100% { transform: scale(1.5); opacity: 0; } }
    .home-animals { position: absolute; inset: 0; z-index: 1; pointer-events: none; }
    .home-animals .ha { position: absolute; opacity: 0.18; filter: blur(2px); animation: drift 9s ease-in-out infinite; }
    .home-animals .ha svg { width: 54px; height: 54px; }
    @keyframes drift { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-14px); } }
    .home-eyebrow { font-size: 11px; letter-spacing: 3px; color: var(--text-mute); margin-bottom: 14px; }
    .home-title { font-size: clamp(38px, 11vw, 52px); line-height: 1.12; font-weight: 800; letter-spacing: -0.02em; margin-bottom: 18px; }
    .home-desc { font-size: 15px; line-height: 1.8; color: var(--text-2); margin-bottom: 34px; max-width: 300px; }
    .btn-primary {
      width: 100%; max-width: 320px; height: 58px; border: none; border-radius: 99px;
      background: linear-gradient(90deg, var(--fire), var(--fire-soft));
      color: #2A1A05; font-size: 17px; font-weight: 800; font-family: inherit; cursor: pointer;
      box-shadow: 0 10px 30px rgba(245, 196, 81, 0.32);
      transition: transform 0.15s ease;
    }
    .btn-primary:active { transform: scale(0.97); }
    .home-foot { margin-top: 18px; font-size: 12px; color: var(--text-mute); }

    /* ---------- Story ---------- */
    .story-inner {
      position: relative; z-index: 2;
      min-height: 100%; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 48px 36px; text-align: center; cursor: pointer;
    }
    .story-step { font-size: 21px; line-height: 1.9; color: var(--text); max-width: 320px; transition: opacity 0.5s ease; }
    .story-step .em { color: var(--fire); font-weight: 700; }
    .story-step .lead { display: block; font-size: 13px; letter-spacing: 2px; color: var(--text-mute); margin-bottom: 18px; }
    .story-hint { position: absolute; bottom: 46px; font-size: 13px; color: var(--text-mute); }
    .story-hint .skip { color: var(--star); margin-left: 10px; text-decoration: underline; }
    .story-enter {
      margin-top: 30px; padding: 14px 34px; border: none; border-radius: 99px;
      background: linear-gradient(90deg, var(--fire), var(--fire-soft)); color: #2A1A05;
      font-size: 16px; font-weight: 800; font-family: inherit; cursor: pointer;
      box-shadow: 0 8px 26px rgba(245, 196, 81, 0.3);
    }
    .story-enter:active { transform: scale(0.97); }

    /* ---------- Chapter intro ---------- */
    .chapter-inner { position: relative; z-index: 2; min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 48px 36px; text-align: center; }
    .ch-index { font-size: 13px; letter-spacing: 4px; color: var(--text-mute); margin-bottom: 18px; }
    .ch-name { font-size: clamp(34px, 9vw, 46px); font-weight: 800; letter-spacing: -0.01em; margin-bottom: 22px; }
    .ch-desc { font-size: 17px; line-height: 1.9; color: var(--text-2); max-width: 320px; margin-bottom: 34px; }

    /* ---------- Quiz ---------- */
    .quiz-inner { position: relative; z-index: 2; min-height: 100%; padding: 56px 24px 36px; display: flex; flex-direction: column; }
    .quiz-top { display: flex; align-items: center; gap: 14px; margin-bottom: 26px; }
    .back-btn { width: 42px; height: 42px; border-radius: 50%; background: rgba(255,255,255,0.07); border: 1px solid var(--border); color: var(--text); font-size: 20px; cursor: pointer; flex-shrink: 0; }
    .back-btn:active { transform: scale(0.94); }
    .milestone { flex: 1; font-size: 14px; color: var(--text-2); line-height: 1.5; }
    .milestone .m-icon { margin-right: 6px; }
    .milestone .m-sub { display: block; font-size: 12px; color: var(--text-mute); margin-top: 2px; }
    .chapter-tag { display: inline-flex; align-items: center; gap: 6px; align-self: flex-start; padding: 6px 14px; border-radius: 99px; background: rgba(245,196,81,0.12); border: 1px solid rgba(245,196,81,0.25); color: var(--fire); font-size: 13px; font-weight: 600; margin-bottom: 16px; }
    .scene { font-size: 22px; line-height: 1.55; font-weight: 700; margin-bottom: 24px; }
    .scene .qname { display: block; font-size: 14px; font-weight: 600; color: var(--fire); margin-bottom: 8px; }
    .options { display: flex; flex-direction: column; gap: 12px; flex: 1; }
    .option {
      display: flex; align-items: flex-start; gap: 12px; padding: 16px;
      border-radius: 16px; background: var(--card); border: 1px solid transparent;
      cursor: pointer; text-align: left; font-family: inherit; color: inherit; width: 100%;
      transition: transform 0.12s ease, border-color 0.2s ease, background 0.2s ease;
    }
    .option:active { transform: scale(0.98); }
    .option.selected { background: rgba(245,196,81,0.12); border-color: var(--fire); box-shadow: 0 0 0 1px rgba(245,196,81,0.35); }
    .opt-text { font-size: 15px; line-height: 1.55; padding: 2px 0; }
    .quiz-watermark { margin-top: 18px; text-align: center; font-size: 12px; letter-spacing: 0.5px; color: rgba(234,244,236,0.30); user-select: none; }

    /* ---------- Awaken ---------- */
    #screen-awaken { background: #000; }
    .awaken-inner { position: relative; min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 40px; text-align: center; }
    .fire {
      position: absolute; top: 42%; left: 50%; width: 40px; height: 40px; border-radius: 50%;
      transform: translate(-50%, -50%) scale(0);
      background: radial-gradient(circle, #FFF3C9, var(--fire) 50%, transparent 72%);
      box-shadow: 0 0 60px 24px rgba(245,196,81,0.4);
      transition: transform 1.6s cubic-bezier(.2,.8,.2,1);
    }
    .fire.lit { transform: translate(-50%, -50%) scale(3.4); }
    .awaken-text { position: relative; z-index: 2; font-size: 18px; color: rgba(255,235,190,0.85); letter-spacing: 1px; opacity: 0; transition: opacity 1s ease 0.6s; margin-top: 60%; }
    .awaken-text.show { opacity: 1; }
    .awaken-animals { position: relative; z-index: 2; display: flex; align-items: center; gap: 18px; margin-top: 24px; opacity: 0; transform: translateY(20px); transition: opacity 1s ease, transform 1s ease; }
    .awaken-animals.show { opacity: 1; transform: translateY(0); }
    .awaken-animals svg { width: 92px; height: 92px; filter: drop-shadow(0 0 18px rgba(245,196,81,0.5)); }
    .awaken-animals .cross { font-size: 36px; color: rgba(255,235,190,0.4); }

    /* ---------- Result ---------- */
    .result-inner { position: relative; z-index: 2; min-height: 100%; padding: 44px 24px 40px; }
    .result-header { font-size: 14px; color: var(--text-2); margin-bottom: 16px; font-weight: 500; }
    .result-animals { display: flex; align-items: center; justify-content: center; gap: 16px; padding: 16px 22px; background: var(--card); border: 1px solid var(--border); border-radius: 24px; margin-bottom: 18px; }
    .result-animals svg { width: 76px; height: 76px; }
    .result-animals .cross { font-size: 30px; color: rgba(255,255,255,0.3); }
    .result-names { font-size: 27px; font-weight: 800; text-align: center; margin-bottom: 12px; }
    .combo-badge { display: table; margin: 0 auto 10px; padding: 9px 22px; border-radius: 99px; background: linear-gradient(90deg, var(--fire), var(--fire-soft)); color: #2A1A05; font-size: 17px; font-weight: 800; }
    .result-fuel { text-align: center; font-size: 15px; color: var(--text-2); margin-bottom: 22px; }
    .chart-card { background: var(--card); border: 1px solid var(--border); border-radius: 20px; padding: 18px 20px; margin-bottom: 16px; }
    .chart-title { font-size: 13px; color: var(--text-mute); text-align: center; margin-bottom: 14px; }
    .bar-row { display: flex; align-items: center; gap: 10px; margin-bottom: 11px; }
    .bar-row:last-child { margin-bottom: 0; }
    .bar-label { width: 42px; font-size: 13px; color: var(--text-2); font-weight: 500; }
    .bar-track { flex: 1; height: 8px; background: rgba(255,255,255,0.08); border-radius: 99px; overflow: hidden; }
    .bar-fill { height: 100%; border-radius: 99px; transition: width 0.9s ease; }
    .info-card { background: var(--card); border: 1px solid var(--border); border-radius: 20px; padding: 18px 20px; margin-bottom: 14px; }
    .info-card.highlight { border-color: rgba(245,196,81,0.32); }
    .info-card h3 { font-size: 17px; font-weight: 700; margin-bottom: 12px; }
    .info-card p { font-size: 14px; line-height: 1.7; color: var(--text-2); margin-bottom: 6px; }
    .info-card p:last-child { margin-bottom: 0; }
    .btn-share {
      width: 100%; height: 56px; border-radius: 99px; border: none; cursor: pointer;
      background: linear-gradient(90deg, var(--fire), var(--fire-soft)); color: #2A1A05;
      font-size: 16px; font-weight: 800; font-family: inherit; margin-top: 6px;
      box-shadow: 0 10px 30px rgba(245,196,81,0.3);
    }
    .btn-share:active { transform: scale(0.97); }

    /* ---------- Share modal ---------- */
    .share-modal { position: fixed; inset: 0; background: rgba(3,8,5,0.92); display: none; flex-direction: column; align-items: center; justify-content: center; padding: 24px; z-index: 200; }
    .share-modal.show { display: flex; }
    .share-modal img { max-width: 100%; max-height: 60vh; border-radius: 18px; box-shadow: 0 12px 40px rgba(0,0,0,0.5); }
    .modal-actions { display: flex; gap: 12px; margin-top: 18px; }
    .modal-actions button { padding: 13px 26px; border-radius: 99px; border: none; font-size: 15px; font-weight: 800; font-family: inherit; cursor: pointer; }
    .modal-actions .save { background: linear-gradient(90deg, var(--fire), var(--fire-soft)); color: #2A1A05; }
    .modal-actions .close { background: rgba(255,255,255,0.12); color: #fff; }
    .modal-tip { color: var(--text-mute); font-size: 13px; margin-top: 12px; text-align: center; }

    @media (max-width: 360px) {
      .home-title { font-size: 36px; }
      .scene { font-size: 19px; }
      .result-names { font-size: 23px; }
      .result-animals svg { width: 62px; height: 62px; }
    }
  </style>
</head>
<body>
  <div id="app">
    <div class="bg-glow"></div>
    <div class="stars" id="stars"></div>
    <div class="fireflies" id="fireflies"></div>

    <!-- Home -->
    <section class="screen active" id="screen-home">
      <div class="home-inner">
        <div class="forest-illust" aria-hidden="true">
          <svg class="fl fl-mountains" viewBox="0 0 400 300" preserveAspectRatio="xMidYMax slice"><path d="M0 205 Q 90 150 170 195 T 330 188 T 400 200 L400 300 L0 300 Z" fill="#0B2016"/><path d="M0 232 Q 110 190 210 222 T 400 215 L400 300 L0 300 Z" fill="#0E291C"/></svg>
          <svg class="fl fl-trees" viewBox="0 0 400 300" preserveAspectRatio="xMidYMax slice"><g fill="#0A1C13"><polygon points="50,250 70,180 90,250"/><polygon points="44,270 70,195 96,270"/><polygon points="120,255 138,195 156,255"/><polygon points="115,272 138,205 161,272"/><polygon points="300,250 320,185 340,250"/><polygon points="294,270 320,200 346,270"/><polygon points="350,258 366,205 382,258"/></g></svg>
          <div class="fl-fog"></div>
          <svg class="fl fl-grass" viewBox="0 0 400 300" preserveAspectRatio="xMidYMax slice"><path d="M0 282 Q 25 268 50 282 T 100 282 T 150 282 T 200 282 T 250 282 T 300 282 T 350 282 T 400 282 L400 300 L0 300 Z" fill="#06120C"/></svg>
        </div>
        <div class="home-animals" id="home-animals"></div>
        <div class="seed-wrap"><div class="seed"></div></div>
        <div class="home-eyebrow">FIND YOUR INNER DRIVE ANIMAL</div>
        <h1 class="home-title">寻找你的<br>内在驱动兽</h1>
        <p class="home-desc">每个人都有一种隐藏的力量。<br>15 关森林冒险之外，你会发现：<br>真正让你行动起来的是什么。</p>
        <button class="btn-primary" onclick="goStory()">开始我的旅程</button>
        <p class="home-foot">基于《Drive》内在驱动力理论</p>
      </div>
    </section>

    <!-- Story -->
    <section class="screen" id="screen-story">
      <div class="story-inner" id="story-inner">
        <div class="story-art" id="story-art"></div>
        <div class="story-step" id="story-step"></div>
        <div class="story-hint" id="story-hint">轻触继续<span class="skip" onclick="startQuiz(event)">跳过</span></div>
      </div>
    </section>

    <!-- Chapter intro -->
    <section class="screen" id="screen-chapter">
      <div class="chapter-inner">
        <div class="ch-index" id="ch-index">第 1 章</div>
        <h2 class="ch-name" id="ch-name">迷雾森林</h2>
        <p class="ch-desc" id="ch-desc"></p>
        <button class="story-enter" onclick="enterChapter()">继续旅程</button>
      </div>
    </section>

    <!-- Quiz -->
    <section class="screen" id="screen-quiz">
      <div class="quiz-inner">
        <div class="quiz-top">
          <button class="back-btn" onclick="prevNode()" aria-label="返回">←</button>
          <div class="milestone" id="milestone"></div>
        </div>
        <div class="chapter-tag" id="chapter-tag"></div>
        <h2 class="scene" id="scene"></h2>
        <div class="options" id="options"></div>
        <div class="quiz-watermark">小红书 @妈不在家</div>
      </div>
    </section>

    <!-- Awaken -->
    <section class="screen" id="screen-awaken">
      <div class="awaken-inner">
        <div class="fire" id="fire"></div>
        <div class="awaken-text" id="awaken-text">你的动力火种正在回应…</div>
        <div class="awaken-animals" id="awaken-animals"></div>
      </div>
    </section>

    <!-- Result -->
    <section class="screen" id="screen-result">
      <div class="result-inner">
        <p class="result-header">你的内在驱动兽</p>
        <div class="result-animals" id="result-animals"></div>
        <h2 class="result-names" id="result-names"></h2>
        <div class="combo-badge" id="combo-badge"></div>
        <div class="result-fuel" id="result-fuel"></div>

        <div class="chart-card">
          <div class="chart-title">五维动力分布</div>
          <div id="chart-bars"></div>
        </div>

        <div class="info-card highlight" id="adv-card">
          <h3>你的优势</h3>
          <div id="adv-list"></div>
        </div>
        <div class="info-card" id="ch-card">
          <h3>隐藏挑战</h3>
          <div id="ch-list"></div>
        </div>
        <div class="info-card" id="env-card">
          <h3>适合你的环境</h3>
          <div id="env-list"></div>
        </div>

        <button class="btn-share" onclick="shareResult()">分享我的动力兽</button>
      </div>
    </section>

    <div class="warp-veil" id="warpVeil"></div>
    <div class="share-modal" id="shareModal">
      <img id="shareImg" alt="我的动力兽分享卡" />
      <div class="modal-actions">
        <button class="save" id="saveShareBtn">保存图片</button>
        <button class="close" onclick="document.getElementById('shareModal').classList.remove('show')">关闭</button>
      </div>
      <p class="modal-tip">长按图片也可保存 · 分享到朋友圈 / 小红书</p>
    </div>
  </div>

  <script src="app.js"></script>
</body>
